name: Build PulseMusic APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses & install SDK 35
        run: |
          SDKMGR="$(command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build Debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Rename APK for distribution
        run: cp app/build/outputs/apk/debug/app-debug.apk PulseMusic-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseMusic-debug-apk
          path: PulseMusic-debug.apk

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0-b${{ github.run_number }}"
          gh release create "$TAG" PulseMusic-debug.apk \
            --title "PulseMusic Debug APK (Build ${{ github.run_number }})" \
            --notes "Automated debug APK build and unit test verification from commit ${{ github.sha }}."
